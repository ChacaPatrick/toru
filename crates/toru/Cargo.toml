[package]
name = "toru"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Only its text input and virtual list are used, as `docs/PLAN.md` allows.
gpui-kit = "=0.9.0"
# The editor's picture: `tiny-skia` draws it, and `image` wraps the pixels for GPUI, which takes
# its `Frame`. Both are in `docs/PLAN.md`.
tiny-skia = "0.12"
# Text annotations are filled from glyph outlines, since `tiny-skia` has no text; `ttf-parser`
# reads them from the bundled fonts and was already in the tree through GPUI.
ttf-parser = "0.25"
toru-core = { path = "../toru-core" }
# `xcap` re-exports the `image` crate, so Toru uses that rather than depending on it directly.
xcap = "=0.9.8"
clipboard-rs = "=0.3.5"
# The system file picker for the custom palette's background photo (`docs/PLAN.md`).
rfd = "0.18"
tray-icon = "=0.26.1"
global-hotkey = "=0.9.0"
