[package]
name = "toru"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Only its text input and virtual list are used, as `docs/PLAN.md` allows.
gpui-kit = "=0.9.0"
toru-core = { path = "../toru-core" }
# `xcap` re-exports the `image` crate, so Toru uses that rather than depending on it directly.
xcap = "=0.9.8"
clipboard-rs = "=0.3.5"

[dev-dependencies]
global-hotkey = "0.9.0"
tray-icon = "0.26.1"
